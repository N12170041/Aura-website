<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura | NOEMA Portal</title>
  <meta name="description" content="Aura NOEMA 傳送門啟動頁，開啟一個私密、溫柔且可控的感知世界。" />

  <!-- cookie -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-81YRQ9YLWY');  //辦完GA4要改
  </script>
  
  <style>
    :root {
      --black: #050306;
      --wine: #4b0f26;
      --wine-soft: #7d2445;
      --purple: #9d72ff;
      --purple-soft: #d7c1ff;
      --gold: #e6c88e;
      --gold-soft: #fff0c6;
      --white: #fff8ee;
      --muted: rgba(255, 248, 238, 0.72);
      --faint: rgba(255, 248, 238, 0.12);
      --glass: rgba(10, 5, 12, 0.34);
      --glass-strong: rgba(255, 248, 238, 0.11);
      --header-height: 74px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--white);
      background: var(--black);
      overflow-x: hidden;
    }

    body.is-restarting .sequence-card,
    body.is-restarting .portal-actions {
      opacity: 0;
      transform: translateY(14px) scale(0.98);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      z-index: 50;
      display: flex;
      justify-content: center;
      padding: 0 clamp(18px, 5vw, 72px);
      background: linear-gradient(to bottom, rgba(5, 3, 6, 0.82), rgba(5, 3, 6, 0.42));
      border-bottom: 1px solid rgba(255, 248, 238, 0.09);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .nav-inner {
      width: min(1180px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-link img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(230, 200, 142, 0.36));
    }

    .brand-word {
      display: flex;
      flex-direction: column;
      gap: 5px;
      line-height: 1;
    }

    .brand-word strong {
      font-size: 0.96rem;
      font-weight: 500;
      letter-spacing: 0.24em;
    }

    .brand-word span {
      color: rgba(255, 248, 238, 0.56);
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .return-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 18px;
      border: 1px solid rgba(230, 200, 142, 0.38);
      border-radius: 999px;
      background: rgba(255, 248, 238, 0.055);
      color: rgba(255, 248, 238, 0.88);
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
      transition: transform 0.28s ease, border-color 0.28s ease, background 0.28s ease;
    }

    .return-link:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 240, 198, 0.76);
      background: rgba(230, 200, 142, 0.12);
    }

    .portal-page {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
    }

    .portal-bg {
      position: fixed;
      inset: 0;
      z-index: -4;
      background-image: url("noema-world-bg.png");
      background-size: cover;
      background-position: center center;
      transform: scale(1.04);
      animation: slowVision 18s ease-in-out infinite alternate;
    }

    .portal-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(5, 3, 6, 0.04) 0%, rgba(5, 3, 6, 0.14) 44%, rgba(5, 3, 6, 0.66) 100%),
        linear-gradient(to bottom, rgba(5, 3, 6, 0.66) 0%, rgba(5, 3, 6, 0.18) 32%, rgba(5, 3, 6, 0.16) 58%, rgba(5, 3, 6, 0.74) 100%),
        linear-gradient(90deg, rgba(5, 3, 6, 0.58), transparent 34%, transparent 66%, rgba(5, 3, 6, 0.56));
    }

    .aura-noise {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(rgba(255, 248, 238, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 248, 238, 0.012) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.85), transparent 78%);
      opacity: 0.65;
    }

    .light-vignette {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, rgba(230, 200, 142, 0.18), transparent 20%),
        radial-gradient(circle at 47% 36%, rgba(157, 114, 255, 0.2), transparent 34%),
        radial-gradient(circle at 60% 74%, rgba(125, 36, 69, 0.22), transparent 28%);
      mix-blend-mode: screen;
      opacity: 0.82;
      animation: glowBreath 7s ease-in-out infinite;
    }

    .particle-layer {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 240, 198, 0.86);
      box-shadow: 0 0 16px rgba(230, 200, 142, 0.72);
      opacity: 0;
      animation: particleFloat linear infinite;
    }

    .hero {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: calc(var(--header-height) + 28px) clamp(18px, 5vw, 72px) 42px;
    }

    .top-copy {
      width: min(1060px, 100%);
      margin: 0 auto;
      text-align: center;
      animation: copyReveal 1.1s ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      color: rgba(255, 240, 198, 0.86);
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: clamp(34px, 8vw, 86px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(230, 200, 142, 0.68), transparent);
    }

    h1 {
      font-size: clamp(2.45rem, 7vw, 6.25rem);
      line-height: 0.9;
      font-weight: 300;
      letter-spacing: -0.065em;
      text-shadow: 0 18px 60px rgba(0, 0, 0, 0.72), 0 0 40px rgba(157, 114, 255, 0.24);
      text-wrap: balance;
    }

    .subtitle {
      width: min(760px, 100%);
      margin: 22px auto 0;
      color: rgba(255, 248, 238, 0.78);
      font-size: clamp(0.98rem, 1.7vw, 1.17rem);
      line-height: 1.85;
      letter-spacing: 0.04em;
      font-weight: 300;
      text-shadow: 0 12px 34px rgba(0, 0, 0, 0.7);
    }

    .sequence-wrap {
      position: relative;
      width: min(620px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: clamp(32px, 6vh, 78px);
      padding-bottom: 20px;
    }

    .sequence-card {
      position: relative;
      width: min(540px, 100%);
      min-height: 238px;
      display: grid;
      place-items: center;
      padding: clamp(26px, 5vw, 44px);
      border: 1px solid rgba(255, 248, 238, 0.18);
      border-radius: 34px;
      background:
        linear-gradient(145deg, rgba(255, 248, 238, 0.13), rgba(255, 248, 238, 0.045)),
        radial-gradient(circle at 50% 0%, rgba(230, 200, 142, 0.14), transparent 44%),
        rgba(10, 5, 12, 0.34);
      box-shadow:
        0 28px 100px rgba(0, 0, 0, 0.52),
        inset 0 0 0 1px rgba(255, 248, 238, 0.04);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      overflow: hidden;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .sequence-card::before {
      content: "";
      position: absolute;
      inset: -45%;
      background: conic-gradient(from 120deg, transparent, rgba(230, 200, 142, 0.16), transparent, rgba(157, 114, 255, 0.16), transparent);
      animation: panelOrbit 12s linear infinite;
      opacity: 0.8;
    }

    .sequence-card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 33px;
      background: radial-gradient(circle at center, rgba(5, 3, 6, 0.12), rgba(5, 3, 6, 0.36) 72%);
      z-index: 0;
    }

    .sequence-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: grid;
      justify-items: center;
      text-align: center;
    }

    .sequence-kicker {
      color: rgba(255, 240, 198, 0.82);
      font-size: 0.76rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .sequence-status {
      margin-top: 10px;
      color: rgba(215, 193, 255, 0.76);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .step-view {
      margin-top: 24px;
      min-height: 104px;
      display: grid;
      justify-items: center;
      align-content: center;
      opacity: 0;
      transform: translateY(16px) scale(0.97);
      filter: blur(8px);
    }

    .step-view.is-visible {
      animation: stepIn 0.46s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .step-view.is-leaving {
      animation: stepOut 0.42s ease forwards;
    }

    .step-number {
      color: rgba(255, 240, 198, 0.92);
      font-size: clamp(2rem, 7vw, 3.9rem);
      line-height: 1;
      font-weight: 200;
      letter-spacing: -0.06em;
      text-shadow: 0 0 28px rgba(230, 200, 142, 0.36);
    }

    .step-label {
      margin-top: 12px;
      color: rgba(255, 248, 238, 0.92);
      font-size: clamp(1.05rem, 2.4vw, 1.36rem);
      letter-spacing: 0.12em;
      line-height: 1.55;
    }

    .step-check {
      margin-top: 16px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #170914;
      background: linear-gradient(135deg, rgba(255, 240, 198, 0.96), rgba(215, 193, 255, 0.88));
      box-shadow: 0 0 26px rgba(230, 200, 142, 0.28);
      font-size: 1.08rem;
      transform: scale(0);
    }

    .step-view.is-visible .step-check {
      animation: checkPop 0.34s ease 0.28s forwards;
    }

    .progress-track {
      position: relative;
      width: min(360px, 100%);
      height: 6px;
      margin-top: 22px;
      border-radius: 999px;
      background: rgba(255, 248, 238, 0.13);
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(125, 36, 69, 0.9), rgba(157, 114, 255, 0.9), rgba(255, 240, 198, 0.95));
      box-shadow: 0 0 24px rgba(157, 114, 255, 0.36);
      transition: width 0.72s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ready-view {
      position: relative;
      z-index: 2;
      display: none;
      justify-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(18px) scale(0.96);
    }

    .ready-view.is-visible {
      display: grid;
      animation: readyIn 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .ready-title {
      color: rgba(255, 240, 198, 0.96);
      font-size: clamp(1.7rem, 4.6vw, 3.1rem);
      line-height: 1.18;
      font-weight: 300;
      letter-spacing: -0.04em;
      text-shadow: 0 0 34px rgba(230, 200, 142, 0.38), 0 18px 60px rgba(0, 0, 0, 0.66);
    }

    .ready-sub {
      margin-top: 14px;
      color: rgba(255, 248, 238, 0.72);
      font-size: 0.92rem;
      line-height: 1.75;
      letter-spacing: 0.08em;
    }

    .portal-actions {
      width: 100%;
      margin-top: 28px;
      display: none;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .portal-actions.is-visible {
      display: flex;
      animation: actionsIn 0.55s ease 0.18s forwards;
    }

    .action-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 22px;
      cursor: pointer;
      border: 1px solid transparent;
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease, background 0.28s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }

    .action-btn:focus-visible,
    .return-link:focus-visible {
      outline: 2px solid rgba(255, 240, 198, 0.88);
      outline-offset: 4px;
    }

    .btn-secondary {
      color: rgba(255, 248, 238, 0.86);
      background: rgba(255, 248, 238, 0.075);
      border-color: rgba(255, 248, 238, 0.2);
    }

    .btn-secondary:hover {
      border-color: rgba(255, 248, 238, 0.38);
      background: rgba(255, 248, 238, 0.13);
    }

    .btn-primary {
      color: #180914;
      background: linear-gradient(135deg, rgba(255, 240, 198, 0.98), rgba(215, 193, 255, 0.9));
      border-color: rgba(255, 240, 198, 0.72);
      box-shadow: 0 18px 46px rgba(230, 200, 142, 0.22);
    }

    .btn-primary:hover {
      box-shadow: 0 22px 56px rgba(230, 200, 142, 0.32);
    }



    /* Opening light-stream intro: SAO-like LINK START feeling, but Aura-styled */
    .link-start-overlay {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at center, rgba(255, 240, 198, 0.16), transparent 18%),
        radial-gradient(circle at center, rgba(157, 114, 255, 0.28), transparent 40%),
        linear-gradient(180deg, #050306 0%, rgba(5, 3, 6, 0.92) 42%, #050306 100%);
      opacity: 1;
      transition: opacity 780ms ease, filter 780ms ease;
    }

    .link-start-overlay.is-leaving {
      opacity: 0;
      filter: blur(16px) brightness(1.25);
    }

    .link-start-core {
      position: relative;
      z-index: 4;
      display: grid;
      place-items: center;
      width: min(520px, 82vw);
      aspect-ratio: 1;
      border-radius: 999px;
      transform: scale(0.72);
      animation: portalDive 1.72s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .link-start-core::before,
    .link-start-core::after {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: inherit;
      border: 1px solid rgba(255, 240, 198, 0.28);
      box-shadow:
        0 0 38px rgba(230, 200, 142, 0.24),
        inset 0 0 44px rgba(157, 114, 255, 0.16);
      animation: linkRing 1.28s ease-out infinite;
    }

    .link-start-core::after {
      inset: -5%;
      border-color: rgba(215, 193, 255, 0.26);
      animation-delay: 0.2s;
      animation-duration: 1.5s;
    }

    .link-start-title {
      position: relative;
      z-index: 5;
      color: rgba(255, 248, 238, 0.96);
      font-size: clamp(2.2rem, 8vw, 5.4rem);
      line-height: 0.92;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow:
        0 0 18px rgba(255, 240, 198, 0.54),
        0 0 42px rgba(157, 114, 255, 0.46),
        0 16px 52px rgba(0, 0, 0, 0.72);
      animation: titleFlash 1.18s ease both;
      white-space: nowrap;
    }

    .link-start-sub {
      position: absolute;
      left: 50%;
      top: calc(50% + clamp(44px, 7vw, 74px));
      transform: translateX(-50%);
      color: rgba(255, 240, 198, 0.78);
      font-size: 0.78rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      white-space: nowrap;
      animation: subtitleFlash 1.12s ease 0.12s both;
    }

    .light-beam {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2;
      width: var(--beam-w, 2px);
      height: var(--beam-h, 42vh);
      border-radius: 999px;
      background: linear-gradient(to bottom, transparent, rgba(255, 240, 198, 0.95), rgba(157, 114, 255, 0.74), transparent);
      box-shadow: 0 0 20px rgba(255, 240, 198, 0.5);
      transform-origin: center bottom;
      opacity: 0;
      animation: lightDive var(--beam-time, 1.25s) cubic-bezier(0.17, 0.84, 0.44, 1) var(--beam-delay, 0s) both;
    }

    .warp-lines {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg 8deg, rgba(255, 240, 198, 0.08) 9deg 10deg, transparent 11deg 18deg),
        radial-gradient(circle at center, transparent 0 10%, rgba(255,255,255,0.08) 12%, transparent 14% 100%);
      mix-blend-mode: screen;
      opacity: 0.72;
      animation: warpSpin 1.55s linear forwards;
    }

    .hero.is-warping .portal-bg,
    .portal-page.is-warping .portal-bg {
      animation-duration: 5s;
      filter: saturate(1.22) brightness(1.08);
    }


    @keyframes portalDive {
      0% { transform: scale(0.5); opacity: 0; filter: blur(16px); }
      28% { opacity: 1; filter: blur(0); }
      72% { transform: scale(1.03); }
      100% { transform: scale(1.55); opacity: 0; filter: blur(10px) brightness(1.35); }
    }

    @keyframes linkRing {
      0% { transform: scale(0.38) rotate(0deg); opacity: 0; }
      24% { opacity: 0.8; }
      100% { transform: scale(1.58) rotate(92deg); opacity: 0; }
    }

    @keyframes titleFlash {
      0% { opacity: 0; letter-spacing: 0.32em; filter: blur(14px); transform: scale(0.92); }
      42% { opacity: 1; filter: blur(0); }
      76% { opacity: 1; letter-spacing: 0.08em; transform: scale(1); }
      100% { opacity: 0; letter-spacing: 0.02em; transform: scale(1.18); filter: blur(8px); }
    }

    @keyframes subtitleFlash {
      0% { opacity: 0; transform: translateX(-50%) translateY(12px); }
      35%, 72% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    }

    @keyframes lightDive {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--beam-rot)) translateY(60vh) scaleY(0.42);
        filter: blur(2px);
      }
      18% { opacity: 0.92; }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--beam-rot)) translateY(-80vh) scaleY(1.9);
        filter: blur(0);
      }
    }

    @keyframes warpSpin {
      0% { transform: scale(0.78) rotate(0deg); opacity: 0; }
      30% { opacity: 0.8; }
      100% { transform: scale(1.36) rotate(42deg); opacity: 0; }
    }

    @keyframes slowVision {
      from {
        transform: scale(1.04) translate3d(-0.4%, -0.2%, 0);
      }
      to {
        transform: scale(1.09) translate3d(0.5%, 0.4%, 0);
      }
    }

    @keyframes glowBreath {
      0%, 100% {
        opacity: 0.66;
        transform: scale(0.98);
      }
      50% {
        opacity: 0.94;
        transform: scale(1.03);
      }
    }

    @keyframes copyReveal {
      from {
        opacity: 0;
        transform: translateY(-18px);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes panelOrbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes stepIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes stepOut {
      to {
        opacity: 0;
        transform: translateY(-18px) scale(0.96);
        filter: blur(10px);
      }
    }

    @keyframes checkPop {
      0% {
        transform: scale(0);
      }
      70% {
        transform: scale(1.12);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes readyIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes actionsIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes particleFloat {
      0% {
        opacity: 0;
        transform: translate3d(0, 34px, 0) scale(0.72);
      }
      18% {
        opacity: 0.72;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--shift), -105vh, 0) scale(1.36);
      }
    }


    @media (max-width: 760px) {
      .link-start-title {
        font-size: clamp(2rem, 13vw, 3.8rem);
        letter-spacing: 0.04em;
      }

      .link-start-sub {
        top: calc(50% + 54px);
        font-size: 0.62rem;
        letter-spacing: 0.18em;
      }

      :root {
        --header-height: 68px;
      }

      .site-header {
        padding: 0 16px;
      }

      .brand-link {
        gap: 9px;
      }

      .brand-link img {
        width: 32px;
        height: 32px;
      }

      .brand-word strong {
        font-size: 0.86rem;
        letter-spacing: 0.18em;
      }

      .brand-word span {
        display: none;
      }

      .return-link {
        min-height: 36px;
        padding: 0 13px;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
      }

      .hero {
        padding: calc(var(--header-height) + 24px) 16px 28px;
      }

      .top-copy {
        text-align: left;
      }

      .eyebrow {
        justify-content: flex-start;
        gap: 10px;
        margin-bottom: 13px;
        font-size: 0.66rem;
      }

      .eyebrow::before {
        width: 32px;
      }

      .eyebrow::after {
        display: none;
      }

      h1 {
        font-size: clamp(2.25rem, 15vw, 4rem);
      }

      .subtitle {
        margin-left: 0;
        margin-right: 0;
        font-size: 0.95rem;
        line-height: 1.75;
      }

      .sequence-wrap {
        align-items: start;
        padding-top: clamp(28px, 7vh, 58px);
      }

      .sequence-card {
        min-height: 224px;
        border-radius: 28px;
        padding: 26px 18px;
      }

      .sequence-card::after {
        border-radius: 27px;
      }

      .step-number {
        font-size: 3rem;
      }

      .step-label {
        font-size: 1.04rem;
        letter-spacing: 0.08em;
      }

      .portal-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .action-btn {
        width: 100%;
      }

      .portal-bg {
        background-position: 50% 50%;
      }
    }

    @media (max-width: 420px) {
      .brand-word strong {
        font-size: 0.8rem;
      }

      .return-link {
        padding: 0 11px;
      }

      .sequence-card {
        min-height: 218px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  

    /* Final QA｜desktop font and spacing polish */
    @media (min-width: 981px) {
      *, *::before, *::after { box-sizing: border-box; }
      h1 {
        max-width: 100%;
        font-size: clamp(2.65rem, 5vw, 4.55rem) !important;
        line-height: 1.02 !important;
        letter-spacing: -0.045em !important;
        overflow-wrap: anywhere;
        text-wrap: balance;
      }
      .hero { padding-top: calc(var(--header-height) + 24px); }
      .subtitle,
      p,
      .step-label,
      .ready-sub,
      .link-start-sub {
        font-size: clamp(.9rem, .95vw, 1rem);
        line-height: 1.72;
        overflow-wrap: break-word;
      }
      .subtitle { max-width: 700px; }
      .sequence-wrap { padding-top: clamp(24px, 4vh, 56px); }
      .sequence-card,
      .sequence-content,
      .step-view,
      .ready-view,
      .portal-actions,
      .link-start-core {
        min-width: 0;
        overflow: visible;
      }
      .sequence-card { min-height: 214px; }
      .step-label,
      .sequence-status,
      .ready-sub,
      .action-btn,
      .return-link {
        letter-spacing: .08em;
        white-space: normal;
      }
      .action-btn,
      button,
      a {
        min-height: 44px;
        height: auto;
        white-space: normal;
        line-height: 1.35;
        text-align: center;
      }
    }
    @media (min-width: 981px) and (max-width: 1366px) {
      h1 { font-size: clamp(2.35rem, 4.6vw, 4rem) !important; }
      .sequence-card { min-height: 228px; }
    }

  </style>
</head>
<body>
  <main class="portal-page">
    <div class="portal-bg" aria-hidden="true"></div>
    <div class="aura-noise" aria-hidden="true"></div>
    <div class="light-vignette" aria-hidden="true"></div>
    <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>
    <div class="link-start-overlay" id="linkStartOverlay" aria-hidden="true">
      <div class="warp-lines"></div>
      <div class="link-start-core">
        <div class="link-start-title">LINK START</div>
        <div class="link-start-sub">Aura Conscious Dive</div>
      </div>
    </div>

    <header class="site-header" aria-label="Aura 頂部品牌欄">
      <div class="nav-inner">
        <a class="brand-link" href="index.html" aria-label="回到 Aura 首頁">
          <img src="aura-logo.png" alt="Aura Logo" />
          <span class="brand-word">
            <strong>AURA</strong>
            <span>NOEMA Interface</span>
          </span>
        </a>
        <a class="return-link" href="noema.html">返回 NOEMA 入口</a>
      </div>
    </header>

    <section class="hero" aria-labelledby="portalTitle">
      <div class="top-copy">
        <p class="eyebrow">Conscious Entry Sequence</p>
        <h1 id="portalTitle">NOEMA 通道已開啟</h1>
        <p class="subtitle">Aura 正在為你開啟一個只屬於你的私密感知空間。</p>
      </div>

      <div class="sequence-wrap">
        <section class="sequence-card" aria-live="polite" aria-label="NOEMA 開啟進度">
          <div class="sequence-content" id="sequenceContent">
            <p class="sequence-kicker">NOEMA 開啟進度</p>
            <p class="sequence-status" id="sequenceStatus">Signal Accepted</p>

            <div class="step-view" id="stepView">
              <p class="step-number" id="stepNumber">01</p>
              <p class="step-label" id="stepLabel">建立意識入口</p>
              <span class="step-check" id="stepCheck">✓</span>
            </div>

            <div class="progress-track" aria-hidden="true">
              <span class="progress-fill" id="progressFill"></span>
            </div>
          </div>

          <div class="ready-view" id="readyView">
            <h2 class="ready-title">傳送門已準備完成</h2>
            <p class="ready-sub">NOEMA 已穩定展開。可以進入下一層私密感知空間。</p>
            <div class="portal-actions" id="portalActions">
              <button class="action-btn btn-secondary" type="button" id="restartBtn">重新開啟傳送門</button>
              <a class="action-btn btn-primary" href="experience-noema.html">進入 NOEMA</a>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const steps = [
      { number: "01", label: "建立意識入口" },
      { number: "02", label: "匿名身份遮罩啟用" },
      { number: "03", label: "NOEMA 場域生成" },
      { number: "04", label: "傳送門已穩定" }
    ];

    const particleLayer = document.getElementById("particleLayer");
    const linkStartOverlay = document.getElementById("linkStartOverlay");
    const sequenceContent = document.getElementById("sequenceContent");
    const sequenceStatus = document.getElementById("sequenceStatus");
    const stepView = document.getElementById("stepView");
    const stepNumber = document.getElementById("stepNumber");
    const stepLabel = document.getElementById("stepLabel");
    const progressFill = document.getElementById("progressFill");
    const readyView = document.getElementById("readyView");
    const portalActions = document.getElementById("portalActions");
    const restartBtn = document.getElementById("restartBtn");

    let timers = [];

    function createParticles() {
      const count = window.innerWidth < 760 ? 32 : 56;

      for (let i = 0; i < count; i += 1) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${65 + Math.random() * 42}%`;
        particle.style.animationDuration = `${11 + Math.random() * 15}s`;
        particle.style.animationDelay = `-${Math.random() * 12}s`;
        particle.style.setProperty("--shift", `${Math.random() * 90 - 45}px`);
        particleLayer.appendChild(particle);
      }
    }

    function createLightStream() {
      const count = window.innerWidth < 760 ? 26 : 46;

      for (let index = 0; index < count; index += 1) {
        const beam = document.createElement("span");
        beam.className = "light-beam";
        beam.style.setProperty("--beam-rot", `${Math.random() * 360}deg`);
        beam.style.setProperty("--beam-w", `${1 + Math.random() * 3}px`);
        beam.style.setProperty("--beam-h", `${34 + Math.random() * 42}vh`);
        beam.style.setProperty("--beam-time", `${0.72 + Math.random() * 0.74}s`);
        beam.style.setProperty("--beam-delay", `${Math.random() * 0.48}s`);
        linkStartOverlay.appendChild(beam);
      }
    }

    function closeIntro(next) {
      document.querySelector(".portal-page").classList.add("is-warping");

      window.setTimeout(() => {
        linkStartOverlay.classList.add("is-leaving");
      }, 1220);

      window.setTimeout(() => {
        linkStartOverlay.remove();
        document.querySelector(".portal-page").classList.remove("is-warping");
        next();
      }, 1880);
    }

    function clearTimers() {
      timers.forEach((timer) => window.clearTimeout(timer));
      timers = [];
    }

    function setStep(index) {
      const step = steps[index];
      stepNumber.textContent = step.number;
      stepLabel.textContent = step.label;
      sequenceStatus.textContent = index === steps.length - 1 ? "Portal Ready" : `Stage ${step.number}`;
      stepView.classList.remove("is-leaving");
      stepView.classList.add("is-visible");
    }

    function hideStep() {
      stepView.classList.remove("is-visible");
      stepView.classList.add("is-leaving");
    }

    function resetSequence() {
      clearTimers();
      document.body.classList.add("is-restarting");
      sequenceContent.style.display = "grid";
      readyView.classList.remove("is-visible");
      portalActions.classList.remove("is-visible");
      stepView.classList.remove("is-visible", "is-leaving");
      progressFill.style.transition = "width 0.001ms linear";
      progressFill.style.width = "0%";
      sequenceStatus.textContent = "Signal Accepted";

      timers.push(window.setTimeout(() => {
        document.body.classList.remove("is-restarting");
      }, 220));
    }

    function showReady() {
      sequenceContent.style.display = "none";
      readyView.classList.add("is-visible");
      portalActions.classList.add("is-visible");
    }

    function runSequence() {
      resetSequence();

      const startDelay = 180;
      const stepGap = 560;
      const visibleTime = 430;
      const totalDuration = startDelay + (steps.length * stepGap) + 420;

      timers.push(window.setTimeout(() => {
        progressFill.style.transition = `width ${totalDuration - 260}ms cubic-bezier(0.16, 1, 0.3, 1)`;
        progressFill.style.width = "100%";
      }, startDelay));

      steps.forEach((_, index) => {
        const showTimer = window.setTimeout(() => {
          setStep(index);
        }, startDelay + index * stepGap);

        const hideTimer = window.setTimeout(() => {
          hideStep();
        }, startDelay + index * stepGap + visibleTime);

        timers.push(showTimer, hideTimer);
      });

      timers.push(window.setTimeout(() => {
        showReady();
      }, totalDuration));
    }

    restartBtn.addEventListener("click", runSequence);

    createParticles();
    createLightStream();
    closeIntro(runSequence);
  </script>
</body>
</html>
